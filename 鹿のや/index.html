<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹿のや - Artisan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      background-color: #1a1a1a;
      color: #f5f0e8;
    }
    header {
      text-align: center;
      padding: 60px 20px 40px;
    }
    header h1 {
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      font-weight: 300;
    }
    header p {
      margin-top: 12px;
      font-size: 1rem;
      color: #b8a88a;
      letter-spacing: 0.1em;
    }
    .gallery {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }
    .gallery figure {
      margin-bottom: 40px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }
    .gallery figcaption {
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #d4c8b0;
      letter-spacing: 0.05em;
    }
    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.8rem;
      color: #6b6055;
    }
  </style>
</head>
<body>
  <header>
    <h1>鹿のや</h1>
    <p>職人の手仕事</p>
  </header>
  <main class="gallery">
    <figure>
      <img src="7C1A5515.JPG" alt="ラディッシュの飾り切り">
      <figcaption>
        繊細な指先が、一枚のラディッシュに命を吹き込む。<br>
        鮮やかな紅色の薄片を丁寧に折り重ね、花びらのように仕立てていく——<br>
        料理が皿に届く前から、職人の美意識はすでに始まっている。
      </figcaption>
    </figure>
  </main>
  <footer>
    &copy; 2026 鹿のや
  </footer>
</body>
</html>
